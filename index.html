<style>
:root{--bg:#f6f4ee;--panel:#fff;--ink:#1f2a22;--muted:#5c6a60;--line:#d9d6cc;--accent:#2e6b43;--err:#a3372a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--panel:#1d2520;--ink:#e8ede9;--muted:#9fb0a4;--line:#34403a;--accent:#74c288;--err:#e08a7c}}
:root[data-theme="dark"]{--bg:#141a16;--panel:#1d2520;--ink:#e8ede9;--muted:#9fb0a4;--line:#34403a;--accent:#74c288;--err:#e08a7c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);

p{margin:0 0 1rem;color:var(--muted);font-size:.9rem}
input[type=password]{width:100%;font:inherit;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink)}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;gap:.45rem;align-items:center;font-size:.85rem;color:var(--muted);margin:.8rem 0 1rem}
button{width:100%;font:inherit;font-weight:600;padding:.6rem;border:0;border-radius:8px;background:var(--accent);
  color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}

small{display:block;margin-top:1rem;color:var(--muted);font-size:.75rem}
#att{display:none;color:var(--muted)}
.auto form{display:none}.auto #att{display:block}

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='cle-golfnexus';
if(!window.crypto||!crypto.subtle||!window.DecompressionStream){
  document.documentElement.classList.remove('auto');
  addEventListener('DOMContentLoaded',()=>{document.getElementById('err').textContent=
    'Ce navigateur est trop ancien pour déchiffrer la page (il faut Chrome 80+, Firefox 113+, Safari 16.4+ ou Edge récent).';});
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.salt),iterations:P.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function ouvre(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.ct));
  const flux=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  const page=await new Response(flux).text();
  document.open();document.write(page);document.close();
}
// lien partage « #cle=… » : on retire la cle de l'adresse (historique, copie
// d'ecran, lien recopie) avant tout, la page dechiffree ne garde que ses filtres
function cleDuLien(){
  const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));
  const k=h.get('cle')||q.get('cle'); if(!k) return null;
  q.delete('cle');h.delete('cle');
  const qs=q.toString(),hs=h.toString();
  history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+(hs?'#'+hs:''));
  const s=k.replace(/-/g,'+').replace(/_/g,'/');   // base64url -> base64
  return s+'='.repeat((4-s.length%4)%4);
}
(async()=>{
  const lien=cleDuLien();
  if(lien){
    try{const key=await crypto.subtle.importKey('raw',b(lien),'AES-GCM',true,['decrypt']);
      await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.ct));   // cle valable ?
      try{localStorage.setItem(K,JSON.stringify({salt:P.salt,k:lien}));}catch(_){}
      await ouvre(key);return;
    }catch(e){document.getElementById('err').textContent=(e&&e.name==='OperationError')
      ?'Ce lien n’est plus valable : entre le mot de passe.':'Erreur du navigateur : '+((e&&e.message)||e);}
  }
  try{const m=JSON.parse(localStorage.getItem(K)||'null');
    if(m&&m.salt===P.salt){
      const key=await crypto.subtle.importKey('raw',b(m.k),'AES-GCM',true,['decrypt']);
      await ouvre(key);return;}
  }catch(e){try{localStorage.removeItem(K);}catch(_){}}
  document.documentElement.classList.remove('auto');   // pas de cle valable : on montre le formulaire
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const go=document.getElementById('go'),err=document.getElementById('err');
  go.disabled=true;go.textContent='Déchiffrement…';err.textContent='';
  try{
    const key=await derive(document.getElementById('pw').value);
    if(document.getElementById('keep').checked){
      const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
      try{localStorage.setItem(K,JSON.stringify({salt:P.salt,k:btoa(String.fromCharCode(...raw))}));}catch(_){}
    }
    await ouvre(key);
  }catch(x){
    try{localStorage.removeItem(K);}catch(_){}
    err.textContent=(x&&x.name==='OperationError')?'Mot de passe incorrect.':('Erreur du navigateur : '+((x&&x.message)||x));
    go.disabled=false;go.textContent='Ouvrir';
  }
});
